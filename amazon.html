<!doctype html>
<div lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
      }
      header {
        background-color: #232f3e;
        color: white;
        padding: 10px 20px;
         position: sticky;
        top: 0;
      }
      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        height: 60px;
       
      }
      .logo img {
        height: 40px;
      }
      .delever p {
        margin: 0;
        font-size: 12px;
      }
      .delever h3 {
        margin: 0;
        font-size: 16px;
      }

      .search-wrapper {
        display: flex;
        align-items: center;
        flex-grow: 1;
        margin: 0 20px;

        border-radius: 4px;
        overflow: hidden;
      }
      input {
        flex: 1;
        height: 40px;
        padding: 8px;
        border: none;
        outline: none;
      }
      select {
        width: 50px;
         height: 40px;
        padding: 8px;
        border: none;
        outline: none;
      }
      button {
         height: 40px;
        padding: 8px 16px;
        background-color: #febd69;
        border: none;
        cursor: pointer;
      }
      .nav2 {
        padding: 10px 20px;
      }
      ul {
        display: flex;
        list-style: none;
        gap: 20px;

      }
     

.shop-section{
    display: flex;
    justify-content: space-evenly;
    margin-top: 20px;
    background-color: #b1acac;
  
    
}
.box{
   
    height: 400px;
    width: 21%;
    background-color: #fff;
    padding: 20px 0px 15px;
      margin-top: 10px;
      
}
.box-image{
    height: 300px;
    width: 100%;


}

.content-box{
    margin-left: 10px;
    margin-right: 10px;
}

.border{
    border: 1px solid transparent;
    padding: 10px;
    
}
.border:hover{
    border: 1px solid #febd69;
    cursor: pointer;
}

    </style>
  </head>
<body>
  <header>
    <nav>
      <div class="logo border">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"
          alt="Amazon Logo"
          width="100"
        />
      </div>

      <div class="delever border">
        <p>Deliver to</p>
        <h3>India</h3>
      </div>

      <div class="search-wrapper border">
        <select>
          <option>All</option>
          <option>Electronics</option>
          <option>Books</option>
          <option>Home & Kitchen</option>
        </select>

        <input type="text" placeholder="Search" />
        <button>Search</button>
      </div>

      <div class="delever border">
        <p>hello,signin</p>
        <h3>Account & lists</h3>
      </div>

      <div class="return border">
        <p>return</p>
        <h3>&Orders</h3>
      </div>

      <div class="cart border">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/6/65/Amazon_icon.svg"
          alt="Cart Icon"
          width="30"
        />
        <span>0</span>
      </div>
    </nav>

    <div class="nav2">
      <ul>
        <li>All</li>
        <li>Today's Deals</li>
        <li>Customer Service</li>
        <li>Registry</li>
        <li>Gift Cards</li>
        <li>Sell</li>
      </ul>
    </div>
  </header>

  <div
    class="hero-section"
    style="
      background-image: url('https://images-eu.ssl-images-amazon.com/images/G/31/IN-Events/Shankhadip/AugART26/AugART_H1_Teaser_2__PC_2X._CB756978071_.jpg');
      height: 300px;
      background-size: cover;
      background-position: top 100px;
    "
  ></div>

  <div class="shop-section">

    <div class="box">
      <div class="content-box">
        <h2>Health & Personal Care</h2>
      <div
        class="box-image"
        style="background-image: url('./box2_image.jpg'); background-size: contain; background-position: center; background-repeat: no-repeat;"
      ></div>
      <a href="#">View Details</a>
      </div>
    </div>

    <div class="box">
      <div class="content-box">
        <h2>Electronics</h2>
      <div
        class="box-image"
        style="background-image: url('./box1_image.jpg'); background-size: contain; background-position: center; background-repeat: no-repeat;"
      ></div>
      <a href="#">View Details</a>
      </div>

    <div class="box">
      <div class="content-box">
        <h2>Electronics</h2>
      <div
        class="box-image"
        style="background-image: url('./box1_image.jpg'); background-size: contain; background-position: center; background-repeat: no-repeat;"
      ></div>
      <a href="#">View Details</a>
      </div>

 

  <footer style="background-color: #232f3e; color: white; padding: 20px; text-align: center;">
    <p>&copy; 2024 Amazon. All rights reserved.</p>
  </footer>
</body>
</html>
